<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hola Valentina</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #FFEB3B; /* amarillo */
    display: flex;
    justify-content: center;
    align-items: center;
  }
  button {
    font-size: 32px;
    font-weight: bold;
    padding: 20px 40px;
    border: none;
    border-radius: 15px;
    background: white;
    color: #333;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: transform 0.1s;
  }
  button:hover {
    transform: scale(1.05);
  }
  button:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
  <button>Hola Valentina</button>
</body>
</html>
